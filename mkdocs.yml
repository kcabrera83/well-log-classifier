site_name: Well Log Classifier
site_description: Automated lithology classification from gamma, resistivity, neutron, density and sonic logs.
repo_url: https://github.com/kcabrera83/well-log-classifier
site_author: Kelvin J Cabrera

theme:
  name: material
  palette:
    primary: indigo
    accent: blue
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top

nav:
  - Home: index.md
  - API Reference: api.md
  - Models: models.md

markdown_extensions:
  - admonition
  - codehilite
  - toc:
      permalink: true
